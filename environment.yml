name: vgtk
channels:
  # No `defaults`. Every package below resolves from conda-forge/bioconda, and
  # `defaults` is Anaconda's own channel: on a CI runner using the preinstalled
  # Anaconda Miniconda it now fails the non-interactive Terms-of-Service check
  # and the whole env solve exits 1 with no useful message.
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  # Core Science Stack (Moved from Pip to Conda for MKL/BLAS optimization)
  - numpy=1.24.3
  - pandas=2.0.1
  - matplotlib=3.7.1
  - requests=2.31.0

  
  # Bioinformatics (Conda-native)
  - biopython=1.81
  - blast >=2.16.0,<=2.17.0   # 2.17.0 has no osx-arm64 build; 2.16.0 does
  - seqkit=2.12.0
  - nextalign=2.14.0
  - mafft=7.526               # BuildReferenceAlignment (reference backbone)
  - nextflow=25.10.3
  - veryfasttree=4.0.5
  - usher=0.6.6
  - mmseqs2=18.8cc5c
  - iqtree=3.0.1
  - ucsc-fatovcf=482
  - epa-ng=0.3.8
  - gappa=0.9.0
  - pytest=9.0.2
  - pytest-cov=7.0.0


  # Utilities
  - requests=2.31.0
  - openpyxl=3.1.2
  - tqdm=4.65.0
  - python-dateutil=2.8.2
  
  # Pip-only packages (Only use Pip for things NOT on Conda)
  - pip
  - pip:
      - ncbi-acc-download==0.2.6
