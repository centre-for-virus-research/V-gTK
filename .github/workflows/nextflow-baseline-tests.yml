name: Nextflow baseline tests (conda)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      include_extended:
        description: "Also run slower extended profiles (HCV_test, flu_gisaid_test)"
        required: false
        default: "false"

jobs:
  baseline-nextflow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - test
          - update_test
          # Reads the frozen GenBank XML snapshot in test_data/iav_11320 rather
          # than calling NCBI: same taxid, ref list and publish_dir as
          # segmented_test, ~2x faster, and deterministic. The live fetch path
          # is still covered here by `test` and `update_test`, which both run
          # FETCH_GENBANK, so nothing stops noticing if NCBI changes.
          # Run segmented_test by hand to exercise the fetch on this profile.
          - segmented_xml_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda env from environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: vgtk-ci
          auto-activate-base: false
          environment-file: environment.yml
          use-mamba: true
          # Miniforge rather than the runner's preinstalled Anaconda Miniconda.
          # That install plus a `defaults` channel fails conda's non-interactive
          # Terms-of-Service check, and setup-miniconda surfaces it only as
          # "The process '/usr/share/miniconda/condabin/conda' failed with exit
          # code 1". python-unit-tests.yml already uses Miniforge, which is why
          # that workflow gets as far as running pytest and this one does not.
          miniforge-variant: Miniforge3
          miniforge-version: latest
          channels: conda-forge,bioconda

      - name: Show environment and Nextflow version
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda info
          python --version
          nextflow -version

      - name: Run Nextflow baseline profile
        shell: bash -l {0}
        run: |
          set -euo pipefail
          nextflow run vgtk-init.nf -profile conda,${{ matrix.profile }}

      - name: Assert baseline test output exists
        shell: bash -l {0}
        run: |
          set -euo pipefail
          case "${{ matrix.profile }}" in
            test)
              test -f test_out/basic_test/tests/test_non_segmented_results.txt
              ;;
            update_test)
              test -f test_out/update_test/tests/test_non_segmented_results.txt
              ;;
            segmented_xml_test)
              test -f test_out/IAV_DB/tests/test_segmented_results.txt
              ;;
            *)
              echo "Unknown profile: ${{ matrix.profile }}" >&2
              exit 1
              ;;
          esac

      - name: Upload baseline test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.profile }}-artifacts
          path: |
            .nextflow.log
            test_out/**/tests/*.txt
            test_out/**/*.db
          if-no-files-found: warn

